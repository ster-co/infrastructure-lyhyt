name: Customer foundation

run-name: Deploy customer foundation ${{ inputs.customer_id }}/${{ inputs.environment }} from ${{ github.ref_name }}

concurrency:
  group: customer-foundation-${{ inputs.customer_id }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: Customer catalog identifier
        required: true
        type: string
      environment:
        description: Customer environment
        required: true
        type: string

env:
  CATALOG_PATH: config/customers.json
  FOUNDATION_TEMPLATE: infra/customer-foundation/main.bicep

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      customer_tenant_id: ${{ steps.resolve.outputs.customer_tenant_id }}
      customer_subscription_id: ${{ steps.resolve.outputs.customer_subscription_id }}
      location: ${{ steps.resolve.outputs.location }}
      region_code: ${{ steps.resolve.outputs.region_code }}
      migration_application_client_id: ${{ steps.resolve.outputs.migration_application_client_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject non-branch refs
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            exit 0
          fi
          echo "This workflow may run only from a branch selected in GitHub Actions." >&2
          exit 1

      - name: Resolve customer foundation catalog
        id: resolve
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer-foundation.json"
          python3 -m scripts.pipeline.resolve_foundation_customer \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" > "$RESOLVED_FILE"
          python3 - "$RESOLVED_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          values = {
              "customer_tenant_id": resolved["customerTenantId"],
              "customer_subscription_id": resolved["subscriptionId"],
              "location": resolved["location"],
              "region_code": resolved["regionCode"],
              "migration_application_client_id": resolved["migration"]["applicationClientId"],
          }
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY

  customer_foundation_what_if:
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check GitHub OIDC availability
        shell: bash
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "GitHub OIDC endpoint unavailable; id-token permission was not granted"
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "GitHub OIDC token unavailable"
            exit 1
          }

      - name: Log in to customer tenant for foundation what-if
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.migration_application_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}

      - name: Validate customer foundation what-if
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          DEPLOYMENT_LOCATION: ${{ needs.resolve.outputs.location }}
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="infra/customer-foundation/environments/.customer-foundation-${GITHUB_RUN_ID}.bicepparam"
          WHAT_IF_DEBUG_LOG="${RUNNER_TEMP}/what-if-debug.log"
          trap 'rm -f "$PARAM_FILE" "$WHAT_IF_DEBUG_LOG"' EXIT
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer-foundation.json"
          python3 -m scripts.pipeline.resolve_foundation_customer \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" > "$RESOLVED_FILE"
          python3 - "$RESOLVED_FILE" "$PARAM_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          from scripts.pipeline.render_bicepparam import render_bicepparam

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          parameters = dict(resolved["foundationParameters"])
          render_bicepparam(Path(sys.argv[2]), "../main.bicep", parameters)
          PY
          az bicep lint --file "$FOUNDATION_TEMPLATE"
          az bicep build --file "$FOUNDATION_TEMPLATE" --stdout > /dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          if ! az deployment sub what-if --parameters "$PARAM_FILE" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$FOUNDATION_TEMPLATE" \
            --debug 2>"$WHAT_IF_DEBUG_LOG"; then
            grep -Ein \
              '715-123420|InvalidTemplateDeployment|innererror|additionalInfo|details|ERROR:' \
              "$WHAT_IF_DEBUG_LOG" || true
            exit 1
          fi

  customer_foundation_apply:
    needs: [resolve, customer_foundation_what_if]
    if: ${{ needs.resolve.result == 'success' && needs.customer_foundation_what_if.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: customer-foundation-apply
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to customer tenant for foundation apply
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.migration_application_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}

      - name: Apply customer foundation
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          DEPLOYMENT_LOCATION: ${{ needs.resolve.outputs.location }}
          FOUNDATION_DEPLOYMENT_NAME: customer-foundation-${{ inputs.customer_id }}-${{ inputs.environment }}-${{ needs.resolve.outputs.region_code }}
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="infra/customer-foundation/environments/.customer-foundation-${GITHUB_RUN_ID}.bicepparam"
          RAW_OUTPUTS_FILE="${RUNNER_TEMP}/customer-foundation-deployment-outputs-raw.json"
          SAFE_OUTPUTS_FILE="${GITHUB_WORKSPACE}/customer-foundation-deployment-outputs.json"
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer-foundation.json"
          trap 'rm -f "$PARAM_FILE" "$RESOLVED_FILE" "$RAW_OUTPUTS_FILE"' EXIT
          python3 -m scripts.pipeline.resolve_foundation_customer \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" > "$RESOLVED_FILE"
          python3 - "$RESOLVED_FILE" "$PARAM_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          from scripts.pipeline.render_bicepparam import render_bicepparam

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          parameters = dict(resolved["foundationParameters"])
          render_bicepparam(Path(sys.argv[2]), "../main.bicep", parameters)
          PY
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          az deployment sub create --parameters "$PARAM_FILE" \
            --name "$FOUNDATION_DEPLOYMENT_NAME" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$FOUNDATION_TEMPLATE" \
            --output none
          az deployment sub show \
            --name "$FOUNDATION_DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json \
            --only-show-errors > "$RAW_OUTPUTS_FILE"
          python3 - "$RAW_OUTPUTS_FILE" "$SAFE_OUTPUTS_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          outputs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = (
              "sqlServerFqdn",
              "sqlDatabaseName",
              "searchEndpoint",
              "aiEndpoint",
              "documentIntelligenceEndpoint",
              "gpt54DeploymentName",
              "gpt5MiniDeploymentName",
              "textEmbedding3LargeDeploymentName",
          )
          safe = {name: outputs[name] for name in expected if name in outputs}
          Path(sys.argv[2]).write_text(
              json.dumps(safe, separators=(",", ":")), encoding="utf-8"
          )
          PY

      - name: Save safe deployment outputs for the completion summary
        uses: actions/upload-artifact@v4
        with:
          name: customer-foundation-outputs-${{ github.run_id }}
          path: customer-foundation-deployment-outputs.json
          if-no-files-found: error
          retention-days: 1

  customer_foundation_search_configuration:
    name: Apply Azure AI Search configuration
    needs: [resolve, customer_foundation_apply]
    if: ${{ needs.resolve.result == 'success' && needs.customer_foundation_apply.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      search_configuration_applied: ${{ steps.apply.outputs.search_configuration_applied }}
      projects_index_name: ${{ steps.apply.outputs.projects_index_name }}
      sharepoint_index_name: ${{ steps.apply.outputs.sharepoint_index_name }}
      indexer_name: ${{ steps.apply.outputs.indexer_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to customer tenant for Search configuration
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.migration_application_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}

      - name: Apply Search JSON
        id: apply
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          FOUNDATION_DEPLOYMENT_NAME: customer-foundation-${{ inputs.customer_id }}-${{ inputs.environment }}-${{ needs.resolve.outputs.region_code }}
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer-foundation.json"
          OUTPUTS_FILE="${RUNNER_TEMP}/customer-foundation-outputs.json"
          trap 'rm -f "$RESOLVED_FILE" "$OUTPUTS_FILE"' EXIT
          python3 -m scripts.pipeline.resolve_foundation_customer \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" > "$RESOLVED_FILE"
          az deployment sub show \
            --name "$FOUNDATION_DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json \
            --only-show-errors > "$OUTPUTS_FILE"
          python3 -m scripts.pipeline.search_configuration_apply \
            --resolved-file "$RESOLVED_FILE" \
            --deployment-outputs-file "$OUTPUTS_FILE" \
            --github-output "$GITHUB_OUTPUT"

  customer_foundation_complete:
    needs: [resolve, customer_foundation_apply, customer_foundation_search_configuration]
    if: ${{ needs.resolve.result == 'success' && needs.customer_foundation_apply.result == 'success' && needs.customer_foundation_search_configuration.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download applied foundation outputs
        uses: actions/download-artifact@v4
        with:
          name: customer-foundation-outputs-${{ github.run_id }}
          path: ${{ runner.temp }}/customer-foundation-outputs

      - name: Resolve the applied customer configuration
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.pipeline.resolve_foundation_customer \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" \
            > "$RUNNER_TEMP/resolved-customer-foundation.json"

      - name: Publish safe customer foundation handoff
        env:
          SEARCH_CONFIGURATION_APPLIED: ${{ needs.customer_foundation_search_configuration.outputs.search_configuration_applied }}
          PROJECTS_INDEX_NAME: ${{ needs.customer_foundation_search_configuration.outputs.projects_index_name }}
          SHAREPOINT_INDEX_NAME: ${{ needs.customer_foundation_search_configuration.outputs.sharepoint_index_name }}
          INDEXER_NAME: ${{ needs.customer_foundation_search_configuration.outputs.indexer_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --resolved-file "$RUNNER_TEMP/resolved-customer-foundation.json"
            --deployment-outputs-file "$RUNNER_TEMP/customer-foundation-outputs/customer-foundation-deployment-outputs.json"
            --search-configuration-applied "$SEARCH_CONFIGURATION_APPLIED"
          )
          if [[ "$SEARCH_CONFIGURATION_APPLIED" == "true" ]]; then
            SEARCH_NAMES_FILE="$RUNNER_TEMP/customer-foundation-search-names.json"
            python3 - "$SEARCH_NAMES_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          names = {
              "projectsIndexName": os.environ["PROJECTS_INDEX_NAME"],
              "sharepointIndexName": os.environ["SHAREPOINT_INDEX_NAME"],
              "indexerName": os.environ["INDEXER_NAME"],
          }
          Path(sys.argv[1]).write_text(json.dumps(names), encoding="utf-8")
          PY
            args+=(--search-index-names-file "$SEARCH_NAMES_FILE")
          fi
          {
            echo '### Customer foundation handoff'
            echo
            echo 'Copy this JSON into the protected `hydrate-vault` phase in SDB-Calculation-v2.'
            echo
            echo '```json'
            python3 -m scripts.pipeline.customer_foundation_manifest "${args[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
