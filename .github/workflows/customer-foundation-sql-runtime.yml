  lyhyt_runtime:
    needs: [resolve, lyhyt_platform, lyhyt_runtime_bootstrap, customer_foundation_apply, runtime_configuration_publish, sql_migration_plan, sql_migration_execute, sql_migration_execute_destructive]
    if: ${{ always() && needs.resolve.result == 'success' && needs.lyhyt_platform.result == 'success' && needs.customer_foundation_apply.result == 'success' && needs.runtime_configuration_publish.result == 'success' && needs.sql_migration_plan.result == 'success' && ((needs.sql_migration_execute.result == 'success' && needs.sql_migration_execute_destructive.result == 'skipped') || (needs.sql_migration_execute.result == 'skipped' && needs.sql_migration_execute_destructive.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to LYHYT tenant for final runtime deployment
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.lyhyt_azure_client_id }}
          tenant-id: ${{ needs.resolve.outputs.lyhyt_azure_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.lyhyt_runtime_subscription_id }}

      - name: Deploy final runtime with customer handoff
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          INPUT_REF_NAME: ${{ github.ref_name }}
          RUNTIME_KEY_VAULT_RESOURCE_ID: ${{ needs.lyhyt_runtime_bootstrap.outputs.runtime_key_vault_resource_id }}
          RUNTIME_KEY_VAULT_URI: ${{ needs.lyhyt_runtime_bootstrap.outputs.runtime_key_vault_uri }}
          REQUIRE_KEY_VAULT: ${{ needs.lyhyt_runtime_bootstrap.outputs.require_key_vault }}
          RUNTIME_PUBLISHER_PRINCIPAL_ID: ${{ needs.lyhyt_runtime_bootstrap.outputs.publisher_principal_id }}
          LYHYT_PLATFORM_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.lyhyt_platform_subscription_id }}
          PLATFORM_KEY_VAULT_RESOURCE_ID: ${{ needs.lyhyt_platform.outputs.platform_key_vault_resource_id }}
          PLATFORM_KEY_VAULT_URI: ${{ needs.lyhyt_platform.outputs.platform_key_vault_uri }}
          CONTAINER_REGISTRY_RESOURCE_ID: ${{ needs.lyhyt_platform.outputs.container_registry_resource_id }}
          CONTAINER_REGISTRY_LOGIN_SERVER: ${{ needs.lyhyt_platform.outputs.container_registry_login_server }}
          DEPLOYMENT_LOCATION: ${{ needs.resolve.outputs.location }}
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="infra/lyhyt-customer-runtime/environments/.customer-runtime-${GITHUB_RUN_ID}.bicepparam"
          trap 'rm -f "$PARAM_FILE"' EXIT
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer.json"
          python3 scripts/pipeline/resolve_customer.py \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" \
            --ref-name "$INPUT_REF_NAME" \
            --release-version "$RELEASE_VERSION" > "$RESOLVED_FILE"
          python3 - "$RESOLVED_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.pipeline.deployment_outputs import validate_resource_id_subscription

          try:
              resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              validate_resource_id_subscription(
                  os.environ["CONTAINER_REGISTRY_RESOURCE_ID"],
                  os.environ["LYHYT_PLATFORM_SUBSCRIPTION_ID"],
                  "Microsoft.ContainerRegistry",
              )
              if os.environ["PLATFORM_KEY_VAULT_RESOURCE_ID"]:
                  validate_resource_id_subscription(
                      os.environ["PLATFORM_KEY_VAULT_RESOURCE_ID"],
                      os.environ["LYHYT_PLATFORM_SUBSCRIPTION_ID"],
                      "Microsoft.KeyVault",
                  )
          except (KeyError, TypeError, ValueError, json.JSONDecodeError):
              raise SystemExit("LYHYT shared resource validation failed") from None
          PY
          python3 - "$RESOLVED_FILE" "$PARAM_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.pipeline.render_bicepparam import render_bicepparam

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          parameters = dict(resolved["runtimeParameters"])
          parameters["containerRegistryReference"] = {
              "resourceId": os.environ["CONTAINER_REGISTRY_RESOURCE_ID"],
              "loginServer": os.environ["CONTAINER_REGISTRY_LOGIN_SERVER"],
          }
          key_vault = dict(parameters["keyVaultConfiguration"])
          key_vault["runtimeKeyVaultResourceId"] = os.environ["RUNTIME_KEY_VAULT_RESOURCE_ID"]
          key_vault["runtimeKeyVaultUri"] = os.environ["RUNTIME_KEY_VAULT_URI"]
          key_vault["customerKeyVaultResourceId"] = ""
          key_vault["customerKeyVaultUri"] = ""
          key_vault["platformKeyVaultResourceId"] = ""
          key_vault["platformKeyVaultUri"] = ""
          key_vault["enabled"] = True
          key_vault["requireKeyVault"] = os.environ["REQUIRE_KEY_VAULT"] == "true"
          parameters["keyVaultConfiguration"] = key_vault
          parameters["runtimePublisherPrincipalId"] = os.environ["RUNTIME_PUBLISHER_PRINCIPAL_ID"]
          parameters["enablePlatformKeyVaultRoleAssignment"] = False
          render_bicepparam(Path(sys.argv[2]), "../main.bicep", parameters)
          PY
          az bicep lint --file "$RUNTIME_TEMPLATE"
          az bicep build --file "$RUNTIME_TEMPLATE" --stdout > /dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          az deployment sub create --parameters "$PARAM_FILE" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$RUNTIME_TEMPLATE" \
            --output none
