name: Customer foundation SQL and runtime

run-name: Deploy ${{ inputs.customer_id }}/${{ inputs.environment }} from ${{ github.ref_name }}

concurrency:
  group: customer-foundation-${{ inputs.customer_id }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: Customer catalog identifier
        required: true
        type: string
      environment:
        description: Customer environment
        required: true
        type: string
        # Must be a key present for the selected customer in
        # config/customers.json; the resolver rejects missing records.
      release_version:
        description: Numeric migration release version, for example 2026.09.30
        required: true
        type: string

env:
  CATALOG_PATH: config/customers.json
  FOUNDATION_TEMPLATE: infra/customer-foundation/main.bicep
  RUNTIME_TEMPLATE: infra/lyhyt-customer-runtime/main.bicep
  PLATFORM_TEMPLATE: infra/lyhyt-platform/main.bicep
  FOUNDATION_MANIFEST: docs/database/migrations/manifest.json
  RELEASE_VERSION: ${{ inputs.release_version }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      customer_tenant_id: ${{ steps.resolve.outputs.customer_tenant_id }}
      customer_subscription_id: ${{ steps.resolve.outputs.customer_subscription_id }}
      location: ${{ steps.resolve.outputs.location }}
      region_code: ${{ steps.resolve.outputs.region_code }}
      migration_application_client_id: ${{ steps.resolve.outputs.migration_application_client_id }}
      migration_principal_object_id: ${{ steps.resolve.outputs.migration_principal_object_id }}
      lyhyt_azure_client_id: ${{ steps.resolve.outputs.lyhyt_azure_client_id }}
      lyhyt_azure_tenant_id: ${{ steps.resolve.outputs.lyhyt_azure_tenant_id }}
      lyhyt_platform_subscription_id: ${{ steps.resolve.outputs.lyhyt_platform_subscription_id }}
      lyhyt_runtime_subscription_id: ${{ steps.resolve.outputs.lyhyt_runtime_subscription_id }}
      customer_sql_runner_label: ${{ steps.resolve.outputs.customer_sql_runner_label }}
      needs_runtime_bootstrap: ${{ steps.resolve.outputs.needs_runtime_bootstrap }}
      same_tenant_rbac_enabled: ${{ steps.resolve.outputs.same_tenant_rbac_enabled }}
      runtime_key_vault_enabled: ${{ steps.resolve.outputs.runtime_key_vault_enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject non-branch refs
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            exit 0
          fi
          echo "This workflow may run only from a branch selected in GitHub Actions." >&2
          exit 1

      - name: Resolve customer catalog
        id: resolve
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          INPUT_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer.json"
          python3 scripts/pipeline/resolve_customer.py \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" \
            --ref-name "$INPUT_REF_NAME" \
            --release-version "$RELEASE_VERSION" > "$RESOLVED_FILE"
          python3 - "$RESOLVED_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          runtime = resolved["runtimeParameters"]
          foundation = resolved["foundationParameters"]
          key_vault = runtime["keyVaultConfiguration"]
          # The runtime vault and its workload identities are prerequisites for
          # every runtime deployment. The bootstrap job is safe to rerun because
          # it preserves active application Key Vault settings when present.
          needs_bootstrap = True
          values = {
              "release_version": resolved["releaseVersion"],
              "customer_tenant_id": resolved["customerTenantId"],
              "customer_subscription_id": resolved["subscriptionId"],
              "location": resolved["location"],
              "region_code": resolved["regionCode"],
              "migration_application_client_id": resolved["migration"]["applicationClientId"],
              "migration_principal_object_id": resolved["migration"]["principalObjectId"],
              "lyhyt_azure_client_id": resolved["automation"]["lyhytAzureClientId"],
              "lyhyt_azure_tenant_id": resolved["automation"]["lyhytAzureTenantId"],
              "lyhyt_platform_subscription_id": resolved["automation"]["lyhytPlatformSubscriptionId"],
              "lyhyt_runtime_subscription_id": resolved["automation"]["lyhytRuntimeSubscriptionId"],
              "customer_sql_runner_label": resolved["automation"]["customerSqlRunnerLabel"],
              "needs_runtime_bootstrap": str(needs_bootstrap).lower(),
              "same_tenant_rbac_enabled": "false",
              "runtime_key_vault_enabled": str(key_vault["enabled"]).lower(),
          }
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for name, value in values.items():
                  output.write(f"{name}={value}\n")
          PY

  lyhyt_platform:
    needs: resolve
    if: ${{ needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      container_registry_resource_id: ${{ steps.deploy.outputs.container_registry_resource_id }}
      container_registry_login_server: ${{ steps.deploy.outputs.container_registry_login_server }}
      platform_key_vault_resource_id: ${{ steps.deploy.outputs.platform_key_vault_resource_id }}
      platform_key_vault_uri: ${{ steps.deploy.outputs.platform_key_vault_uri }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to LYHYT tenant for shared platform outputs
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.lyhyt_azure_client_id }}
          tenant-id: ${{ needs.resolve.outputs.lyhyt_azure_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.lyhyt_platform_subscription_id }}

      - name: Read shared platform deployment outputs
        id: deploy
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          LYHYT_PLATFORM_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.lyhyt_platform_subscription_id }}
          PLATFORM_OUTPUTS_FILE: ${{ runner.temp }}/lyhyt-platform-outputs.json
        shell: bash
        run: |
          set -euo pipefail
          az bicep lint --file "$PLATFORM_TEMPLATE"
          az bicep build --file "$PLATFORM_TEMPLATE" --stdout > /dev/null
          az deployment sub show --name "lyhyt-platform-${DEPLOYMENT_ENVIRONMENT}" \
            --query properties.outputs \
            --output json > "$PLATFORM_OUTPUTS_FILE"
          python3 - "$PLATFORM_OUTPUTS_FILE" "$GITHUB_OUTPUT" "$LYHYT_PLATFORM_SUBSCRIPTION_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          from scripts.pipeline.deployment_outputs import (
              extract_platform_outputs,
              validate_resource_id_subscription,
          )

          try:
              outputs = extract_platform_outputs(
                  json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              )
              safe = outputs.to_safe_dict()
              validate_resource_id_subscription(
                  safe["containerRegistryId"], sys.argv[3], "Microsoft.ContainerRegistry"
              )
              if safe["platformKeyVaultResourceId"]:
                  validate_resource_id_subscription(
                      safe["platformKeyVaultResourceId"], sys.argv[3], "Microsoft.KeyVault"
                  )
          except (OSError, ValueError, json.JSONDecodeError):
              raise SystemExit("shared platform returned invalid safe outputs") from None

          output_names = {
              "containerRegistryId": "container_registry_resource_id",
              "containerRegistryLoginServer": "container_registry_login_server",
              "platformKeyVaultResourceId": "platform_key_vault_resource_id",
              "platformKeyVaultUri": "platform_key_vault_uri",
          }
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for source_name, output_name in output_names.items():
                  output.write(f"{output_name}={safe[source_name]}\n")
          PY

  lyhyt_runtime_bootstrap:
    needs: [resolve, lyhyt_platform]
    if: ${{ needs.resolve.result == 'success' && needs.lyhyt_platform.result == 'success' && needs.resolve.outputs.needs_runtime_bootstrap == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      identity_principal_id: ${{ steps.bootstrap.outputs.identity_principal_id }}
      identity_client_id: ${{ steps.bootstrap.outputs.identity_client_id }}
      runtime_key_vault_resource_id: ${{ steps.bootstrap.outputs.runtime_key_vault_resource_id }}
      runtime_key_vault_name: ${{ steps.bootstrap.outputs.runtime_key_vault_name }}
      runtime_key_vault_uri: ${{ steps.bootstrap.outputs.runtime_key_vault_uri }}
      document_parser_identity_principal_id: ${{ steps.bootstrap.outputs.document_parser_identity_principal_id }}
      mailbox_sync_identity_principal_id: ${{ steps.bootstrap.outputs.mailbox_sync_identity_principal_id }}
      sdb_identity_principal_id: ${{ steps.bootstrap.outputs.sdb_identity_principal_id }}
      document_parser_function_app_hostname: ${{ steps.bootstrap.outputs.document_parser_function_app_hostname }}
      mailbox_sync_function_app_hostname: ${{ steps.bootstrap.outputs.mailbox_sync_function_app_hostname }}
      sdb_function_app_hostname: ${{ steps.bootstrap.outputs.sdb_function_app_hostname }}
      function_host_storage_account_name: ${{ steps.bootstrap.outputs.function_host_storage_account_name }}
      publisher_principal_id: ${{ steps.bootstrap.outputs.publisher_principal_id }}
      require_key_vault: ${{ steps.bootstrap.outputs.require_key_vault }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to LYHYT tenant for runtime bootstrap
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.lyhyt_azure_client_id }}
          tenant-id: ${{ needs.resolve.outputs.lyhyt_azure_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.lyhyt_runtime_subscription_id }}

      - name: Bootstrap runtime Key Vault and workload identities
        id: bootstrap
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          INPUT_REF_NAME: ${{ github.ref_name }}
          BOOTSTRAP_OUTPUT_FILE: ${{ runner.temp }}/runtime-bootstrap-outputs.json
          LYHYT_PLATFORM_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.lyhyt_platform_subscription_id }}
          PLATFORM_KEY_VAULT_RESOURCE_ID: ${{ needs.lyhyt_platform.outputs.platform_key_vault_resource_id }}
          PLATFORM_KEY_VAULT_URI: ${{ needs.lyhyt_platform.outputs.platform_key_vault_uri }}
          CONTAINER_REGISTRY_RESOURCE_ID: ${{ needs.lyhyt_platform.outputs.container_registry_resource_id }}
          CONTAINER_REGISTRY_LOGIN_SERVER: ${{ needs.lyhyt_platform.outputs.container_registry_login_server }}
          DEPLOYMENT_LOCATION: ${{ needs.resolve.outputs.location }}
          REGION_CODE: ${{ needs.resolve.outputs.region_code }}
          LYHYT_AZURE_CLIENT_ID: ${{ needs.resolve.outputs.lyhyt_azure_client_id }}
          LYHYT_RUNTIME_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.lyhyt_runtime_subscription_id }}
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="infra/lyhyt-customer-runtime/environments/.customer-runtime-${GITHUB_RUN_ID}.bicepparam"
          trap 'rm -f "$PARAM_FILE"' EXIT
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer.json"
          python3 scripts/pipeline/resolve_customer.py \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" \
            --ref-name "$INPUT_REF_NAME" \
            --release-version "$RELEASE_VERSION" > "$RESOLVED_FILE"
          RUNTIME_RESOURCE_GROUP="rg-lyhyt-${CUSTOMER_ID}-${DEPLOYMENT_ENVIRONMENT}-${REGION_CODE}"
          RUNTIME_CONTAINER_APP="ca-lyhyt-${CUSTOMER_ID}-api-${DEPLOYMENT_ENVIRONMENT}"
          CURRENT_RUNTIME_KEY_VAULT_URI="$(az containerapp show \
            --name "$RUNTIME_CONTAINER_APP" \
            --resource-group "$RUNTIME_RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='CLIENT_KEY_VAULT_URI'].value | [0]" \
            --output tsv 2>/dev/null || true)"
          CURRENT_REQUIRE_KEY_VAULT="$(az containerapp show \
            --name "$RUNTIME_CONTAINER_APP" \
            --resource-group "$RUNTIME_RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='REQUIRE_KEY_VAULT'].value | [0]" \
            --output tsv 2>/dev/null || true)"
          PUBLISHER_PRINCIPAL_ID="$(az ad sp show --id "$LYHYT_AZURE_CLIENT_ID" --query id --output tsv)"
          export CURRENT_RUNTIME_KEY_VAULT_URI CURRENT_REQUIRE_KEY_VAULT PUBLISHER_PRINCIPAL_ID
          python3 - "$RESOLVED_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.pipeline.deployment_outputs import validate_resource_id_subscription

          try:
              resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              validate_resource_id_subscription(
                  os.environ["CONTAINER_REGISTRY_RESOURCE_ID"],
                  os.environ["LYHYT_PLATFORM_SUBSCRIPTION_ID"],
                  "Microsoft.ContainerRegistry",
              )
              if os.environ["PLATFORM_KEY_VAULT_RESOURCE_ID"]:
                  validate_resource_id_subscription(
                      os.environ["PLATFORM_KEY_VAULT_RESOURCE_ID"],
                      os.environ["LYHYT_PLATFORM_SUBSCRIPTION_ID"],
                      "Microsoft.KeyVault",
                  )
          except (KeyError, TypeError, ValueError, json.JSONDecodeError):
              raise SystemExit("LYHYT shared resource validation failed") from None
          PY
          python3 - "$RESOLVED_FILE" "$PARAM_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.pipeline.render_bicepparam import render_bicepparam

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          parameters = dict(resolved["runtimeParameters"])
          parameters["containerRegistryReference"] = {
              "resourceId": os.environ["CONTAINER_REGISTRY_RESOURCE_ID"],
              "loginServer": os.environ["CONTAINER_REGISTRY_LOGIN_SERVER"],
          }
          key_vault = dict(parameters["keyVaultConfiguration"])
          current_uri = os.environ.get("CURRENT_RUNTIME_KEY_VAULT_URI", "").strip()
          current_require = os.environ.get("CURRENT_REQUIRE_KEY_VAULT", "").strip().lower()
          key_vault["customerKeyVaultResourceId"] = ""
          key_vault["customerKeyVaultUri"] = ""
          key_vault["runtimeKeyVaultResourceId"] = ""
          key_vault["runtimeKeyVaultUri"] = current_uri
          key_vault["platformKeyVaultResourceId"] = os.environ["PLATFORM_KEY_VAULT_RESOURCE_ID"]
          key_vault["platformKeyVaultUri"] = os.environ["PLATFORM_KEY_VAULT_URI"]
          key_vault["enabled"] = bool(current_uri)
          key_vault["requireKeyVault"] = current_require == "true" if current_uri else False
          parameters["keyVaultConfiguration"] = key_vault
          parameters["runtimePublisherPrincipalId"] = os.environ["PUBLISHER_PRINCIPAL_ID"]
          parameters["enablePlatformKeyVaultRoleAssignment"] = False
          render_bicepparam(Path(sys.argv[2]), "../main.bicep", parameters)
          PY
          az bicep lint --file "$RUNTIME_TEMPLATE"
          az bicep build --file "$RUNTIME_TEMPLATE" --stdout > /dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          az deployment sub create --parameters "$PARAM_FILE" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$RUNTIME_TEMPLATE" \
            --query 'properties.outputs' \
            --output json > "$BOOTSTRAP_OUTPUT_FILE"
          python3 - "$BOOTSTRAP_OUTPUT_FILE" "$GITHUB_OUTPUT" "$LYHYT_RUNTIME_SUBSCRIPTION_ID" "$PUBLISHER_PRINCIPAL_ID" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.pipeline.deployment_outputs import (
              extract_runtime_outputs,
              validate_resource_id_subscription,
          )

          try:
              values = extract_runtime_outputs(
                  json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              ).to_safe_dict()
              validate_resource_id_subscription(
                  values["runtimeKeyVaultResourceId"],
                  sys.argv[3],
                  "Microsoft.KeyVault",
              )
          except (OSError, ValueError, json.JSONDecodeError):
              raise SystemExit("runtime bootstrap returned invalid safe outputs") from None

          output_names = {
              "runtimeKeyVaultResourceId": "runtime_key_vault_resource_id",
              "runtimeKeyVaultName": "runtime_key_vault_name",
              "runtimeKeyVaultUri": "runtime_key_vault_uri",
              "identityClientId": "identity_client_id",
              "identityPrincipalId": "identity_principal_id",
              "documentParserIdentityPrincipalId": "document_parser_identity_principal_id",
              "mailboxSyncIdentityPrincipalId": "mailbox_sync_identity_principal_id",
              "sdbIdentityPrincipalId": "sdb_identity_principal_id",
              "documentParserFunctionAppHostname": "document_parser_function_app_hostname",
              "mailboxSyncFunctionAppHostname": "mailbox_sync_function_app_hostname",
              "sdbFunctionAppHostname": "sdb_function_app_hostname",
              "functionHostStorageAccountName": "function_host_storage_account_name",
          }
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for source_name, output_name in output_names.items():
                  output.write(f"{output_name}={values[source_name]}\n")
              output.write(f"publisher_principal_id={sys.argv[4]}\n")
              output.write(
                  "require_key_vault="
                  + ("true" if os.environ.get("CURRENT_REQUIRE_KEY_VAULT", "").strip().lower() == "true" else "false")
                  + "\n"
              )
          PY

  customer_foundation_what_if:
    needs: [resolve, lyhyt_platform, lyhyt_runtime_bootstrap]
    if: ${{ always() && needs.resolve.result == 'success' && needs.lyhyt_platform.result == 'success' && (needs.lyhyt_runtime_bootstrap.result == 'success' || needs.lyhyt_runtime_bootstrap.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check GitHub OIDC availability
        shell: bash
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "GitHub OIDC endpoint unavailable; id-token permission was not granted"
            exit 1
          }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "GitHub OIDC token unavailable"
            exit 1
          }
      - name: Log in to customer tenant for foundation what-if
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.migration_application_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}

      - name: Validate customer foundation what-if
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          INPUT_REF_NAME: ${{ github.ref_name }}
          SAME_TENANT_RBAC_ENABLED: ${{ needs.resolve.outputs.same_tenant_rbac_enabled }}
          BOOTSTRAP_PRINCIPAL_ID: ${{ needs.lyhyt_runtime_bootstrap.outputs.identity_principal_id }}
          LYHYT_TENANT_ID: ${{ needs.resolve.outputs.lyhyt_azure_tenant_id }}
          DEPLOYMENT_LOCATION: ${{ needs.resolve.outputs.location }}
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="infra/customer-foundation/environments/.customer-foundation-${GITHUB_RUN_ID}.bicepparam"
          trap 'rm -f "$PARAM_FILE"' EXIT
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer.json"
          python3 scripts/pipeline/resolve_customer.py \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" \
            --ref-name "$INPUT_REF_NAME" \
            --release-version "$RELEASE_VERSION" > "$RESOLVED_FILE"
          python3 - "$RESOLVED_FILE" "$PARAM_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.pipeline.render_bicepparam import render_bicepparam

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          parameters = dict(resolved["foundationParameters"])
          if os.environ["SAME_TENANT_RBAC_ENABLED"] == "true":
              customer_tenant_id = resolved["customerTenantId"]
              lyhyt_tenant_id = os.environ["LYHYT_TENANT_ID"]
              if not lyhyt_tenant_id or customer_tenant_id.casefold() != lyhyt_tenant_id.casefold():
                  raise SystemExit("same-tenant runtime Key Vault RBAC requires matching tenants")
              principal_id = os.environ["BOOTSTRAP_PRINCIPAL_ID"]
              if not principal_id:
                  raise SystemExit("runtime bootstrap did not return a principal ID")
              parameters["runtimeAccessPrincipalId"] = principal_id
              parameters["enableSameTenantRuntimeKeyVaultRoleAssignment"] = True
          render_bicepparam(Path(sys.argv[2]), "../main.bicep", parameters)
          PY
          az bicep lint --file "$FOUNDATION_TEMPLATE"
          az bicep build --file "$FOUNDATION_TEMPLATE" --stdout > /dev/null
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          az deployment sub what-if --parameters "$PARAM_FILE" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$FOUNDATION_TEMPLATE"

  customer_foundation_apply:
    needs: [resolve, lyhyt_platform, lyhyt_runtime_bootstrap, customer_foundation_what_if]
    if: ${{ always() && needs.resolve.result == 'success' && needs.lyhyt_platform.result == 'success' && needs.customer_foundation_what_if.result == 'success' && (needs.lyhyt_runtime_bootstrap.result == 'success' || needs.lyhyt_runtime_bootstrap.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: customer-foundation-apply
    outputs:
      sqlServerFqdn: ${{ steps.apply.outputs.sqlServerFqdn }}
      sqlDatabaseName: ${{ steps.apply.outputs.sqlDatabaseName }}
      sqlServerResourceId: ${{ steps.apply.outputs.sqlServerResourceId }}
      sqlDatabaseResourceId: ${{ steps.apply.outputs.sqlDatabaseResourceId }}
      customerKeyVaultResourceId: ${{ steps.apply.outputs.customerKeyVaultResourceId }}
      customerKeyVaultUri: ${{ steps.apply.outputs.customerKeyVaultUri }}
      searchEndpoint: ${{ steps.apply.outputs.searchEndpoint }}
      aiEndpoint: ${{ steps.apply.outputs.aiEndpoint }}
      documentIntelligenceEndpoint: ${{ steps.apply.outputs.documentIntelligenceEndpoint }}
      gpt5DeploymentName: ${{ steps.apply.outputs.gpt5DeploymentName }}
      gpt54DeploymentName: ${{ steps.apply.outputs.gpt54DeploymentName }}
      gpt5MiniDeploymentName: ${{ steps.apply.outputs.gpt5MiniDeploymentName }}
      textEmbedding3LargeDeploymentName: ${{ steps.apply.outputs.textEmbedding3LargeDeploymentName }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to customer tenant for foundation apply
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.migration_application_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}

      - name: Apply customer foundation and capture safe outputs
        id: apply
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF_TYPE: ${{ github.ref_type }}
          INPUT_REF_NAME: ${{ github.ref_name }}
          SAME_TENANT_RBAC_ENABLED: ${{ needs.resolve.outputs.same_tenant_rbac_enabled }}
          BOOTSTRAP_PRINCIPAL_ID: ${{ needs.lyhyt_runtime_bootstrap.outputs.identity_principal_id }}
          LYHYT_TENANT_ID: ${{ needs.resolve.outputs.lyhyt_azure_tenant_id }}
          FOUNDATION_OUTPUTS_FILE: ${{ runner.temp }}/customer-foundation-outputs.json
          DEPLOYMENT_LOCATION: ${{ needs.resolve.outputs.location }}
          CUSTOMER_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.customer_subscription_id }}
        shell: bash
        run: |
          set -euo pipefail
          PARAM_FILE="infra/customer-foundation/environments/.customer-foundation-${GITHUB_RUN_ID}.bicepparam"
          trap 'rm -f "$PARAM_FILE"' EXIT
          RESOLVED_FILE="${RUNNER_TEMP}/resolved-customer.json"
          python3 scripts/pipeline/resolve_customer.py \
            --catalog "$CATALOG_PATH" \
            --customer-id "$CUSTOMER_ID" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --ref-type "$INPUT_REF_TYPE" \
            --ref-name "$INPUT_REF_NAME" \
            --release-version "$RELEASE_VERSION" > "$RESOLVED_FILE"
          python3 - "$RESOLVED_FILE" "$PARAM_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.pipeline.render_bicepparam import render_bicepparam

          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          parameters = dict(resolved["foundationParameters"])
          if os.environ["SAME_TENANT_RBAC_ENABLED"] == "true":
              customer_tenant_id = resolved["customerTenantId"]
              lyhyt_tenant_id = os.environ["LYHYT_TENANT_ID"]
              if not lyhyt_tenant_id or customer_tenant_id.casefold() != lyhyt_tenant_id.casefold():
                  raise SystemExit("same-tenant runtime Key Vault RBAC requires matching tenants")
              principal_id = os.environ["BOOTSTRAP_PRINCIPAL_ID"]
              if not principal_id:
                  raise SystemExit("runtime bootstrap did not return a principal ID")
              parameters["runtimeAccessPrincipalId"] = principal_id
              parameters["enableSameTenantRuntimeKeyVaultRoleAssignment"] = True
          render_bicepparam(Path(sys.argv[2]), "../main.bicep", parameters)
          PY
          az bicep build-params --file "$PARAM_FILE" --stdout > /dev/null
          az deployment sub create --parameters "$PARAM_FILE" \
            --location "$DEPLOYMENT_LOCATION" \
            --template-file "$FOUNDATION_TEMPLATE" \
            --query properties.outputs \
            --output json > "$FOUNDATION_OUTPUTS_FILE"
          python3 - "$FOUNDATION_OUTPUTS_FILE" "$GITHUB_OUTPUT" "$CUSTOMER_SUBSCRIPTION_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          from scripts.pipeline.deployment_outputs import (
              extract_foundation_outputs,
              validate_resource_id_subscription,
          )

          try:
              outputs = extract_foundation_outputs(
                  json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              )
              safe = outputs.to_safe_dict()
              validate_resource_id_subscription(
                  safe["sqlServerResourceId"], sys.argv[3], "Microsoft.Sql"
              )
              validate_resource_id_subscription(
                  safe["sqlDatabaseResourceId"], sys.argv[3], "Microsoft.Sql"
              )
              validate_resource_id_subscription(
                  safe["customerKeyVaultResourceId"], sys.argv[3], "Microsoft.KeyVault"
              )
          except (OSError, ValueError, json.JSONDecodeError):
              raise SystemExit("customer foundation returned invalid safe outputs") from None

          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for name, value in safe.items():
                  output.write(f"{name}={value}\n")
          PY

  runtime_configuration_publish:
    needs: [resolve, lyhyt_runtime_bootstrap, customer_foundation_apply]
    if: ${{ needs.resolve.result == 'success' && needs.lyhyt_runtime_bootstrap.result == 'success' && needs.customer_foundation_apply.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to LYHYT tenant for runtime Key Vault publication
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.lyhyt_azure_client_id }}
          tenant-id: ${{ needs.resolve.outputs.lyhyt_azure_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.lyhyt_runtime_subscription_id }}

      - name: Publish complete runtime configuration
        env:
          CUSTOMER_TENANT_ID: ${{ needs.resolve.outputs.customer_tenant_id }}
          RUNTIME_KEY_VAULT_NAME: ${{ needs.lyhyt_runtime_bootstrap.outputs.runtime_key_vault_name }}
          FOUNDATION_SQL_SERVER_FQDN: ${{ needs.customer_foundation_apply.outputs.sqlServerFqdn }}
          FOUNDATION_SQL_DATABASE_NAME: ${{ needs.customer_foundation_apply.outputs.sqlDatabaseName }}
          FOUNDATION_AI_ENDPOINT: ${{ needs.customer_foundation_apply.outputs.aiEndpoint }}
          FOUNDATION_SEARCH_ENDPOINT: ${{ needs.customer_foundation_apply.outputs.searchEndpoint }}
          FOUNDATION_DOCUMENT_INTELLIGENCE_ENDPOINT: ${{ needs.customer_foundation_apply.outputs.documentIntelligenceEndpoint }}
          FOUNDATION_GPT5_DEPLOYMENT_NAME: ${{ needs.customer_foundation_apply.outputs.gpt5DeploymentName }}
          FOUNDATION_GPT54_DEPLOYMENT_NAME: ${{ needs.customer_foundation_apply.outputs.gpt54DeploymentName }}
          FOUNDATION_GPT5_MINI_DEPLOYMENT_NAME: ${{ needs.customer_foundation_apply.outputs.gpt5MiniDeploymentName }}
          FOUNDATION_EMBEDDING_DEPLOYMENT_NAME: ${{ needs.customer_foundation_apply.outputs.textEmbedding3LargeDeploymentName }}
          RUNTIME_DOCUMENT_PARSER_HOSTNAME: ${{ needs.lyhyt_runtime_bootstrap.outputs.document_parser_function_app_hostname }}
          RUNTIME_MAILBOX_SYNC_HOSTNAME: ${{ needs.lyhyt_runtime_bootstrap.outputs.mailbox_sync_function_app_hostname }}
          RUNTIME_SDB_HOSTNAME: ${{ needs.lyhyt_runtime_bootstrap.outputs.sdb_function_app_hostname }}
          RUNTIME_STORAGE_ACCOUNT_NAME: ${{ needs.lyhyt_runtime_bootstrap.outputs.function_host_storage_account_name }}
          FOUNDATION_OUTPUTS_FILE: ${{ runner.temp }}/runtime-foundation-outputs.json
          RUNTIME_OUTPUTS_FILE: ${{ runner.temp }}/runtime-outputs.json
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$FOUNDATION_OUTPUTS_FILE" "$RUNTIME_OUTPUTS_FILE"' EXIT
          python3 - "$FOUNDATION_OUTPUTS_FILE" "$RUNTIME_OUTPUTS_FILE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          def output(name):
              return {"value": os.environ.get(name, "")}

          foundation = {
              "sqlServerFqdn": output("FOUNDATION_SQL_SERVER_FQDN"),
              "sqlDatabaseName": output("FOUNDATION_SQL_DATABASE_NAME"),
              "aiEndpoint": output("FOUNDATION_AI_ENDPOINT"),
              "searchEndpoint": output("FOUNDATION_SEARCH_ENDPOINT"),
              "documentIntelligenceEndpoint": output("FOUNDATION_DOCUMENT_INTELLIGENCE_ENDPOINT"),
              "gpt5DeploymentName": output("FOUNDATION_GPT5_DEPLOYMENT_NAME"),
              "gpt54DeploymentName": output("FOUNDATION_GPT54_DEPLOYMENT_NAME"),
              "gpt5MiniDeploymentName": output("FOUNDATION_GPT5_MINI_DEPLOYMENT_NAME"),
              "textEmbedding3LargeDeploymentName": output("FOUNDATION_EMBEDDING_DEPLOYMENT_NAME"),
          }
          runtime = {
              "documentParserFunctionAppHostname": output("RUNTIME_DOCUMENT_PARSER_HOSTNAME"),
              "mailboxSyncFunctionAppHostname": output("RUNTIME_MAILBOX_SYNC_HOSTNAME"),
              "sdbFunctionAppHostname": output("RUNTIME_SDB_HOSTNAME"),
              "functionHostStorageAccountName": output("RUNTIME_STORAGE_ACCOUNT_NAME"),
          }
          Path(sys.argv[1]).write_text(json.dumps(foundation), encoding="utf-8")
          Path(sys.argv[2]).write_text(json.dumps(runtime), encoding="utf-8")
          PY
          python3 scripts/pipeline/publish_runtime_configuration.py \
            --foundation-outputs "$FOUNDATION_OUTPUTS_FILE" \
            --runtime-outputs "$RUNTIME_OUTPUTS_FILE" \
            --customer-tenant-id "$CUSTOMER_TENANT_ID" \
            --vault-name "$RUNTIME_KEY_VAULT_NAME"

  sql_migration_preflight:
    needs: [resolve, customer_foundation_apply]
    if: ${{ needs.resolve.result == 'success' && needs.customer_foundation_apply.result == 'success' }}
    runs-on: ${{ needs.resolve.outputs.customer_sql_runner_label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to customer tenant for SQL preflight
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.migration_application_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}

      - name: Install and validate migration runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement requirements.txt
          python3 -c 'import azure.identity'

      - name: Validate SQL resource IDs from foundation apply
        env:
          CUSTOMER_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.customer_subscription_id }}
          SQL_SERVER_RESOURCE_ID: ${{ needs.customer_foundation_apply.outputs.sqlServerResourceId }}
          SQL_DATABASE_RESOURCE_ID: ${{ needs.customer_foundation_apply.outputs.sqlDatabaseResourceId }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          from scripts.pipeline.deployment_outputs import validate_resource_id_subscription

          try:
              validate_resource_id_subscription(
                  os.environ["SQL_SERVER_RESOURCE_ID"],
                  os.environ["CUSTOMER_SUBSCRIPTION_ID"],
                  "Microsoft.Sql",
              )
              validate_resource_id_subscription(
                  os.environ["SQL_DATABASE_RESOURCE_ID"],
                  os.environ["CUSTOMER_SUBSCRIPTION_ID"],
                  "Microsoft.Sql",
              )
          except ValueError:
              raise SystemExit("SQL resource output subscription validation failed") from None
          PY

      - name: Run mandatory Python, driver, token, and SQL preflight
        env:
          SQL_SERVER_FQDN: ${{ needs.customer_foundation_apply.outputs.sqlServerFqdn }}
          SQL_DATABASE_NAME: ${{ needs.customer_foundation_apply.outputs.sqlDatabaseName }}
          MIGRATION_APPLICATION_CLIENT_ID: ${{ needs.resolve.outputs.migration_application_client_id }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.sql.apply_migrations \
            --manifest "$FOUNDATION_MANIFEST" \
            --sql-server-fqdn "$SQL_SERVER_FQDN" \
            --sql-database-name "$SQL_DATABASE_NAME" \
            --release-version "$RELEASE_VERSION" \
            --expected-application-client-id "$MIGRATION_APPLICATION_CLIENT_ID" \
            --preflight

  sql_migration_plan:
    needs: [resolve, customer_foundation_apply, sql_migration_preflight]
    if: ${{ needs.resolve.result == 'success' && needs.customer_foundation_apply.result == 'success' && needs.sql_migration_preflight.result == 'success' }}
    runs-on: ${{ needs.resolve.outputs.customer_sql_runner_label }}
    outputs:
      has_destructive_migrations: ${{ steps.plan.outputs.has_destructive_migrations }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to customer tenant for SQL migration plan
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.migration_application_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}

      - name: Install and validate migration runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --requirement requirements.txt
          python3 -c 'import azure.identity'

      - name: Verify migration manifest
        id: plan
        env:
          SQL_SERVER_FQDN: ${{ needs.customer_foundation_apply.outputs.sqlServerFqdn }}
          SQL_DATABASE_NAME: ${{ needs.customer_foundation_apply.outputs.sqlDatabaseName }}
          SQL_SERVER_RESOURCE_ID: ${{ needs.customer_foundation_apply.outputs.sqlServerResourceId }}
          SQL_DATABASE_RESOURCE_ID: ${{ needs.customer_foundation_apply.outputs.sqlDatabaseResourceId }}
          CUSTOMER_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.customer_subscription_id }}
          VERIFICATION_FILE: ${{ runner.temp }}/migration-verification.json
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          from scripts.pipeline.deployment_outputs import validate_resource_id_subscription

          for resource_id in (os.environ["SQL_SERVER_RESOURCE_ID"], os.environ["SQL_DATABASE_RESOURCE_ID"]):
              try:
                  validate_resource_id_subscription(
                      resource_id, os.environ["CUSTOMER_SUBSCRIPTION_ID"], "Microsoft.Sql"
                  )
              except ValueError:
                  raise SystemExit("SQL resource output subscription validation failed") from None
          PY
          python3 -m scripts.sql.verify_migrations \
            --manifest "$FOUNDATION_MANIFEST" \
            --release-version "$RELEASE_VERSION" \
            --output json > "$VERIFICATION_FILE"
          python3 - "$VERIFICATION_FILE" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          value = result.get("hasDestructiveMigrations")
          if not isinstance(value, bool):
              raise SystemExit("migration verification did not return a destructive flag")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"has_destructive_migrations={str(value).lower()}\n")
          PY

