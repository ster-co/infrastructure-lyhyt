          parameter_file="$RUNNER_TEMP/stamp-runtime.json"
          wrapper_file="$RUNNER_TEMP/provider-stamp-runtime.json"
          (cd sdb && AZURE_CLIENT_OBJECT_ID="$PROVIDER_PRINCIPAL_ID" python3 -m infrastructure.scripts.build_stamp_parameters \
            --stage runtime --output "$parameter_file" \
            )
          python3 - "$parameter_file" "$resolved" "$wrapper_file" <<'PY'
          import json, sys
          from pathlib import Path
          from scripts.pipeline.provider_deployment import wrap_stamp_parameters
          stamp_parameters = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          resolved = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))["providerStamp"]
          wrapped = wrap_stamp_parameters(stamp_parameters, resource_group_name=resolved["resourceGroup"], location=resolved["location"], customer_id=resolved["id"])
          Path(sys.argv[3]).write_text(json.dumps(wrapped), encoding="utf-8")
          PY
          deployment="provider-stamp-$CUSTOMER_ID-$CUSTOMER_ENVIRONMENT-runtime"
