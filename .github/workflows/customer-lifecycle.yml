          subscription = subprocess.check_output(["az", "account", "show", "--query", "id", "-o", "tsv"], text=True).strip()
          validate_target(tenant, subscription, os.environ["EXPECTED_TENANT_ID"], os.environ["EXPECTED_SUBSCRIPTION_ID"])
          PY
          resolved="$RUNNER_TEMP/resolved-lifecycle.json"
          python3 -m scripts.pipeline.resolve_lifecycle \
            --catalog config/customers.json --app-catalog sdb/deploy/app-customers.json \
            --customer-id "$CUSTOMER_ID" --environment "$CUSTOMER_ENVIRONMENT" \
            --operation onboard --release-version "$RELEASE_VERSION" --ref-type "$REF_TYPE" > "$resolved"
          export CUSTOMER_JSON
          CUSTOMER_JSON=$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["providerStamp"]))' "$resolved")
          export APPLICATION_INSIGHTS_WORKSPACE_RESOURCE_ID
          APPLICATION_INSIGHTS_WORKSPACE_RESOURCE_ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["providerStamp"]["deploymentContext"]["applicationInsightsWorkspaceResourceId"])' "$resolved")
          parameter_file="$RUNNER_TEMP/stamp-foundation.json"
          wrapper_file="$RUNNER_TEMP/provider-stamp-foundation.json"
          (cd sdb && AZURE_CLIENT_OBJECT_ID="$PROVIDER_PRINCIPAL_ID" python3 -m infrastructure.scripts.build_stamp_parameters \
            --stage foundation --output "$parameter_file"
            )
          python3 - "$parameter_file" "$resolved" "$wrapper_file" <<'PY'
          import json, sys
          from pathlib import Path
          from scripts.pipeline.provider_deployment import wrap_stamp_parameters
          stamp_parameters = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          resolved = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))["providerStamp"]
          wrapped = wrap_stamp_parameters(stamp_parameters, resource_group_name=resolved["resourceGroup"], location=resolved["location"], customer_id=resolved["id"])
          Path(sys.argv[3]).write_text(json.dumps(wrapped), encoding="utf-8")
          PY
          az deployment sub create \
            --name "provider-stamp-$CUSTOMER_ID-$CUSTOMER_ENVIRONMENT-foundation" \
            --location "${{ needs.resolve.outputs.provider_location }}" \
            --template-file sdb/infrastructure/provider-stamp-subscription.bicep \
            --parameters "@$wrapper_file" --output none

  provider_runtime_preflight:
    needs: [resolve, provider_foundation_apply, provider_prerequisites_ready]
    if: ${{ inputs.operation == 'onboard' && needs.resolve.result == 'success' && needs.provider_foundation_apply.result == 'success' && needs.provider_prerequisites_ready.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create read-only SDB catalog token
        id: sdb-app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPLOYMENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_GITHUB_APP_PRIVATE_KEY }}
          owner: ster-co
          repositories: SDB-Calculation-v2
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: ster-co/SDB-Calculation-v2
          ref: ${{ inputs.release_version }}
          path: sdb
          token: ${{ steps.sdb-app-token.outputs.token }}
      - uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.provider_oidc_client_id }}
          tenant-id: ${{ needs.resolve.outputs.provider_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.provider_subscription_id }}
      - name: Confirm provider target, customer DNS, and Key Vault secret names
        env:
          EXPECTED_TENANT_ID: ${{ needs.resolve.outputs.provider_tenant_id }}
          EXPECTED_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.provider_subscription_id }}
          CUSTOMER_ID: ${{ inputs.customer_id }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from scripts.pipeline.provider_deployment import validate_target
          tenant = subprocess.check_output(["az", "account", "show", "--query", "tenantId", "-o", "tsv"], text=True).strip()
          subscription = subprocess.check_output(["az", "account", "show", "--query", "id", "-o", "tsv"], text=True).strip()
          validate_target(tenant, subscription, os.environ["EXPECTED_TENANT_ID"], os.environ["EXPECTED_SUBSCRIPTION_ID"])
          PY
          resolved="$RUNNER_TEMP/resolved-lifecycle.json"
          python3 -m scripts.pipeline.resolve_lifecycle \
            --catalog config/customers.json --app-catalog sdb/deploy/app-customers.json \
            --customer-id "$CUSTOMER_ID" --environment "$CUSTOMER_ENVIRONMENT" \
            --operation onboard --release-version "$RELEASE_VERSION" --ref-type "$REF_TYPE" > "$resolved"
          api_app=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["providerStamp"]["deployment"]["containerAppName"])' "$resolved")
          environment=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["providerStamp"]["deployment"]["managedEnvironmentName"])' "$resolved")
          hostname=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["providerStamp"]["hostname"])' "$resolved")
          default_domain=$(az containerapp env show --name "$environment" --resource-group "${{ needs.resolve.outputs.provider_resource_group }}" --query properties.defaultDomain -o tsv)
          expected_target="${api_app}.${default_domain}"
          actual_target=$(dig +short CNAME "$hostname" | head -n1 | tr '[:upper:]' '[:lower:]' | sed 's/\.$//')
          test "$actual_target" = "$(printf '%s' "$expected_target" | tr '[:upper:]' '[:lower:]')" || {
            echo "DNS CNAME must point exactly to $expected_target before managed certificate provisioning." >&2
            exit 1
          }
          vault=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["providerStamp"]["deployment"]["keyVaultName"])' "$resolved")
          for attempt in $(seq 1 12); do
            az keyvault secret list --vault-name "$vault" --query '[].name' --output json > "$RUNNER_TEMP/secret-names.json" && break
            sleep 10
          done
          python3 - "$resolved" "$RUNNER_TEMP/secret-names.json" <<'PY'
          import json, sys
          from pathlib import Path
          from scripts.pipeline.provider_deployment import validate_required_secret_names
          resolved = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          app = resolved["application"]
          names = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          missing = validate_required_secret_names(app["requiredKeyVaultSecretNames"], names)
          if missing:
              raise SystemExit("Key Vault is missing required secret names (values are never read): " + ", ".join(missing))
          generated_missing = sorted({"document-parser-code", "extraction-code"} - set(names))
          Path(sys.argv[2]).write_text(json.dumps(names), encoding="utf-8")
          Path(sys.argv[2] + ".generated-missing").write_text(json.dumps(generated_missing), encoding="utf-8")
          PY
          printf '%s' 'not-configured' > "$RUNNER_TEMP/generated-key-placeholder"
          while IFS= read -r secret_name; do
            [ -n "$secret_name" ] || continue
            az keyvault secret set --vault-name "$vault" --name "$secret_name" --file "$RUNNER_TEMP/generated-key-placeholder" --output none
          done < <(python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/secret-names.json.generated-missing")

  provider_prerequisites_ready:
    name: Confirm customer DNS and Key Vault prerequisites are ready
    needs: [resolve, provider_foundation_apply]
    if: ${{ inputs.operation == 'onboard' && needs.resolve.result == 'success' && needs.provider_foundation_apply.result == 'success' }}
