          certificate_id=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["managedCertificateResourceId"]["value"])' "$RUNNER_TEMP/runtime-outputs.json")
          state=""
          for attempt in $(seq 1 40); do
            state=$(az resource show --ids "$certificate_id" --query properties.provisioningState -o tsv 2>/dev/null || true)
