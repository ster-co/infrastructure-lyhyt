          test "$state" = Succeeded || {
            echo "Managed hostname certificate did not reach Succeeded (state=$state)." >&2
            exit 1
          }
          python3 - "$resolved" "$RUNNER_TEMP/provider-customer.json" <<'PY'
          import json, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["providerStamp"]
          Path(sys.argv[2]).write_text(json.dumps(value), encoding="utf-8")
          PY
          (cd sdb && python3 infrastructure/scripts/verify_provider_stamp.py \
            --customer-json "$RUNNER_TEMP/provider-customer.json" \
            --subscription-id "$EXPECTED_SUBSCRIPTION_ID" \
            --acr-name "$ACR_NAME" \
            --acr-resource-group "$ACR_RESOURCE_GROUP" \
            --application-insights-workspace-resource-id "$APPLICATION_INSIGHTS_WORKSPACE_RESOURCE_ID")
