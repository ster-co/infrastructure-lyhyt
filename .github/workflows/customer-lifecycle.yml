          path: sdb
          token: ${{ steps.sdb-app-token.outputs.token }}
      - name: Prepare applied deployment outputs
        if: ${{ inputs.operation == 'onboard' }}
        uses: actions/download-artifact@v4
        with:
          pattern: lifecycle-*-outputs
          path: ${{ runner.temp }}/outputs
          merge-multiple: true
      - name: Log in to customer tenant to read foundation outputs
        if: ${{ inputs.operation == 'release' }}
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.customer_oidc_client_id }}
          tenant-id: ${{ needs.resolve.outputs.customer_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.customer_subscription_id }}
      - name: Verify customer target and read existing foundation deployment
        if: ${{ inputs.operation == 'release' }}
        env:
          EXPECTED_TENANT_ID: ${{ needs.resolve.outputs.customer_tenant_id }}
          EXPECTED_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.customer_subscription_id }}
          CUSTOMER_ID: ${{ inputs.customer_id }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from scripts.pipeline.provider_deployment import validate_target
          tenant = subprocess.check_output(["az", "account", "show", "--query", "tenantId", "-o", "tsv"], text=True).strip()
          subscription = subprocess.check_output(["az", "account", "show", "--query", "id", "-o", "tsv"], text=True).strip()
          validate_target(tenant, subscription, os.environ["EXPECTED_TENANT_ID"], os.environ["EXPECTED_SUBSCRIPTION_ID"])
          PY
          az deployment sub show --name "customer-foundation-$CUSTOMER_ID-$CUSTOMER_ENVIRONMENT" \
            --query properties.outputs --output json > "$RUNNER_TEMP/outputs/foundation-outputs.json"
      - name: Log in to provider tenant to read existing runtime deployment
        if: ${{ inputs.operation == 'release' }}
        uses: azure/login@v2
        with:
          client-id: ${{ needs.resolve.outputs.provider_oidc_client_id }}
          tenant-id: ${{ needs.resolve.outputs.provider_tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.provider_subscription_id }}
      - name: Verify provider target and read existing runtime deployment
        if: ${{ inputs.operation == 'release' }}
        env:
          EXPECTED_TENANT_ID: ${{ needs.resolve.outputs.provider_tenant_id }}
          EXPECTED_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.provider_subscription_id }}
          CUSTOMER_ID: ${{ inputs.customer_id }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from scripts.pipeline.provider_deployment import validate_target
          tenant = subprocess.check_output(["az", "account", "show", "--query", "tenantId", "-o", "tsv"], text=True).strip()
          subscription = subprocess.check_output(["az", "account", "show", "--query", "id", "-o", "tsv"], text=True).strip()
          validate_target(tenant, subscription, os.environ["EXPECTED_TENANT_ID"], os.environ["EXPECTED_SUBSCRIPTION_ID"])
          PY
          az deployment sub show --name "provider-stamp-$CUSTOMER_ID-$CUSTOMER_ENVIRONMENT-runtime" \
            --query properties.outputs --output json > "$RUNNER_TEMP/outputs/runtime-outputs.json"
      - name: Build the allowlisted versioned app handoff
        env:
          CUSTOMER_ID: ${{ inputs.customer_id }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/resolved-lifecycle.json"
          python3 -m scripts.pipeline.resolve_lifecycle \
            --catalog config/customers.json --app-catalog sdb/deploy/app-customers.json \
            --customer-id "$CUSTOMER_ID" --environment "$CUSTOMER_ENVIRONMENT" \
            --operation "$OPERATION" --release-version "$RELEASE_VERSION" --ref-type "$REF_TYPE" > "$resolved"
          python3 -m scripts.pipeline.lifecycle_handoff \
            --resolved-file "$resolved" \
            --foundation-outputs-file "$RUNNER_TEMP/outputs/foundation-outputs.json" \
            --runtime-outputs-file "$RUNNER_TEMP/outputs/runtime-outputs.json" \
            --operation "$OPERATION" --release-version "$RELEASE_VERSION" \
            --output "$RUNNER_TEMP/customer-lifecycle-handoff.json"
      - uses: actions/upload-artifact@v4
        with:
          name: customer-lifecycle-handoff-${{ inputs.customer_id }}-${{ inputs.environment }}
          path: ${{ runner.temp }}/customer-lifecycle-handoff.json
          if-no-files-found: error
          retention-days: 1

  dispatch_app_release:
    needs: [resolve, collect_handoff]
    if: ${{ needs.resolve.result == 'success' && needs.collect_handoff.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Create least-privilege token for SDB workflow dispatch
        id: dispatch-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPLOYMENT_GITHUB_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_GITHUB_APP_PRIVATE_KEY }}
          owner: ster-co
          repositories: SDB-Calculation-v2
          permission-actions: write
          permission-contents: read
      - name: Dispatch pinned app-only deployment and wait for completion
        env:
          SDB_GITHUB_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          CUSTOMER_ID: ${{ inputs.customer_id }}
          CUSTOMER_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/app-dispatch-inputs.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          values = {
              "customer_id": os.environ["CUSTOMER_ID"],
              "environment": os.environ["CUSTOMER_ENVIRONMENT"],
              "operation": os.environ["OPERATION"],
              "release_version": os.environ["RELEASE_VERSION"],
              "source_repository": os.environ["SOURCE_REPOSITORY"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
          }
          Path(sys.argv[1]).write_text(json.dumps(values), encoding="utf-8")
          PY
          title="lifecycle/$SOURCE_RUN_ID/$CUSTOMER_ID/$CUSTOMER_ENVIRONMENT/$OPERATION/$RELEASE_VERSION"
          python3 -m scripts.pipeline.github_dispatch \
            --ref "$RELEASE_VERSION" \
            --inputs-file "$RUNNER_TEMP/app-dispatch-inputs.json" \
            --expected-title "$title" \
            --output-file "$RUNNER_TEMP/app-dispatch-result.json"
