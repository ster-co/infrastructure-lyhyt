        run: |
          {
            echo '### Provider prerequisites'
            echo
            echo 'Before approving this checkpoint, add the required customer secret values to the provider Key Vault and point the customer API CNAME at the new Container Apps environment default domain.'
            echo "Hostname: $CUSTOMER_HOSTNAME"
            echo "Provider resource group: $PROVIDER_RESOURCE_GROUP"
            echo 'The following runtime preflight verifies secret names only and checks the exact CNAME target. It never reads or logs secret values.'
          } >> "$GITHUB_STEP_SUMMARY"

