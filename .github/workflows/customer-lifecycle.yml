              resource_group_name=resolved["resourceGroup"],
              location=resolved["location"],
              customer_id=resolved["id"],
          )
          Path(sys.argv[3]).write_text(json.dumps(wrapped), encoding="utf-8")
          PY
          az bicep lint --file sdb/infrastructure/provider-stamp-subscription.bicep
          az bicep build --file sdb/infrastructure/provider-stamp-subscription.bicep --stdout >/dev/null
          az deployment sub what-if \
            --name "provider-stamp-$CUSTOMER_ID-$CUSTOMER_ENVIRONMENT-foundation" \
            --location "${{ needs.resolve.outputs.provider_location }}" \
            --template-file sdb/infrastructure/provider-stamp-subscription.bicep \
